<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Item Counter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app">

        <header class="header">
            <h1>Item Counter</h1>
            <p>Name an item, then count it up or down.</p>
        </header>

        <div class="title-group">
            <label for="list-title" class="title-label">Title (Excel File Name)</label>
            <div class="title-input-wrapper">
                <svg class="title-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <input id="list-title" class="input input-title" type="text" placeholder="Title (e.g. Inventory Audit, Grocery List)" maxlength="80">
                <span class="file-ext-badge" title="Will export as .xlsx">.xlsx</span>
            </div>
        </div>

        <form id="add-form" class="add-form" autocomplete="off">
            <label for="item-name" class="visually-hidden">Item name</label>
            <input id="item-name" class="input" type="text" placeholder="Item name" maxlength="60">
            <button type="submit" class="btn-add">Add item</button>
        </form>

        <div class="toolbar" id="toolbar">
            <div class="stats-summary" id="stats-summary" aria-live="polite">
                <span class="stat-badge" id="stat-items-count">0 items</span>
                <span class="stat-badge stat-badge-accent" id="stat-total-count">0 total count</span>
            </div>
            <button type="button" id="btn-export" class="btn-export" disabled aria-label="Export items to Excel">
                <svg class="export-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <path d="M8 13h8"></path>
                    <path d="M8 17h8"></path>
                    <path d="M12 9v8"></path>
                </svg>
                <span>Export to Excel</span>
            </button>
        </div>

        <ul id="item-list" class="item-list"></ul>

        <p id="empty-state" class="empty-state" hidden>No items yet. Add your first one above.</p>

        <div class="bottom-actions" id="bottom-actions" hidden>
            <button type="button" id="btn-reset-all" class="btn-reset" disabled aria-label="Reset all counts to zero">
                <svg class="reset-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                </svg>
                <span>Reset all counts</span>
            </button>
        </div>

        <div id="toast" class="toast toast-hidden" role="status" aria-live="polite" hidden>
            <svg class="toast-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span id="toast-message">Exported to Excel successfully</span>
        </div>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
